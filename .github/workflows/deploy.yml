name: Deploy to GitHub Pages and Synology NAS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ──────────────────────────────────────────
      # Build #1 — for the NAS (apex domain, base '/')
      # ──────────────────────────────────────────
      - name: Build for aspensig.asia (NAS)
        run: npm run build

      - name: Install Rclone
        run: sudo -v ; curl https://rclone.org/install.sh | sudo bash
      - name: Deploy to NCKU PHDc NAS via WebDAV
        # Non-fatal: if the NAS WebDAV endpoint (dev.aspensig.asia) is
        # unreachable, don't block the public GitHub Pages build/deploy that
        # follows. The NAS catches up on the next run once it is back online.
        continue-on-error: true
        # continue-on-error reports the step as succeeding even when it does
        # not, so read the log, not the badge, when the NAS misbehaves.
        # The cap exists because continue-on-error covers a failure but not a
        # hang: an unresponsive NAS otherwise stalls the Pages steps behind it.
        timeout-minutes: 25
        env:
          WEBDAV_PASS: ${{ secrets.NAS_PASSWORD }}
        run: |
          OBSCURED_PASS=$(rclone obscure "$WEBDAV_PASS")

          # Pass 1 - structure. Uploads new and resized files and removes what
          # no longer exists. Re-uploading *everything* here (--ignore-times)
          # is what used to push this past 10 minutes and draw 408s out of the
          # NAS; rclone then refuses to delete anything ("not deleting files as
          # there were IO errors"), so removed pages lingered on the live site.
          rclone sync ./dist :webdav:/AsPEN.sig \
            --webdav-url="https://dev.aspensig.asia" \
            --webdav-user="aspen-git" \
            --webdav-pass="$OBSCURED_PASS" \
            --webdav-vendor="other" \
            --transfers=2 \
            --checkers=2 \
            --contimeout=30s \
            --timeout=120s \
            --retries=3 \
            --low-level-retries=5

          # Pass 2 - text files, forced. The NAS exposes neither modtimes nor
          # MD5, so pass 1 compares by size alone and would skip an HTML file
          # whose length is unchanged while its hashed asset refs differ, which
          # serves stale CSS/JS. These files are small, so forcing all of them
          # costs little. CSS and JS carry content hashes in their names, so a
          # change there is a new filename and pass 1 already caught it.
          rclone copy ./dist :webdav:/AsPEN.sig \
            --include "*.html" \
            --include "*.xml" \
            --include "*.txt" \
            --include "*.json" \
            --ignore-times \
            --webdav-url="https://dev.aspensig.asia" \
            --webdav-user="aspen-git" \
            --webdav-pass="$OBSCURED_PASS" \
            --webdav-vendor="other" \
            --transfers=2 \
            --checkers=2 \
            --contimeout=30s \
            --timeout=120s \
            --retries=3 \
            --low-level-retries=5

      # ──────────────────────────────────────────
      # Build #2 — for GitHub Pages mirror (subpath base '/AsPEN/')
      # ──────────────────────────────────────────
      - name: Build for GitHub Pages
        env:
          DEPLOY_TARGET: ghpages
        run: |
          rm -rf dist
          npm run build

      - name: Upload artifact to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
